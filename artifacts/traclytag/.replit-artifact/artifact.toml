kind = "web"
previewPath = "/"
title = "TraclyTag Admin"
version = "1.0.0"
id = "artifacts/traclytag"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22313

[services.development]
run = "pnpm --filter @workspace/traclytag run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/traclytag", "run", "build" ]
publicDir = "artifacts/traclytag/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22313"
BASE_PATH = "/"
