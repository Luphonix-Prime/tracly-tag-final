services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file:
      - .env
    environment:
      # Vite proxy requests internally to port 3000
      - API_URL=http://localhost:3000
    volumes:
      # Mount the database directory to persist SQLite data on the host
      - ./lib/db:/app/lib/db
      # Mount the uploads directory to persist uploaded assets
      - ./artifacts/api-server/uploads:/app/artifacts/api-server/uploads
    restart: always
